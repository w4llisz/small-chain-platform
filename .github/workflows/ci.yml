name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Verify operations console
        run: make web-verify

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: small_chain
          POSTGRES_PASSWORD: local_e2e_only
          POSTGRES_DB: small_chain_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U small_chain -d small_chain_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://small_chain:local_e2e_only@localhost:5432/small_chain_e2e?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.go-version'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install console and Chromium
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Exercise durable operator cancellation
        run: make test-e2e

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Verify source and real process behavior
        run: make verify
      - name: Fuzz request normalization
        run: make fuzz
      - name: Show package coverage
        run: go tool cover -func=coverage.out
      - name: Build minimal non-root container
        run: docker build -t small-chain:ci .
      - name: Exercise durable Compose stack
        run: make compose-smoke
      - name: Exercise optional trace collection
        run: make compose-trace-smoke

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: small_chain
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: small_chain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U small_chain -d small_chain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://small_chain:local_ci_only@localhost:5432/small_chain_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.go-version'
          cache: true
      - name: Verify module checksums
        run: go mod verify
      - name: Test durable HTTP, scheduling and process recovery
        run: make test-integration
      - name: Exercise migration command twice
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          make migrate
          make migrate

  measurement:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Collect bounded durable measurement evidence
        run: make measure-compose
      - name: Preserve raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measurement-${{ github.sha }}
          path: artifacts/measurement
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  incident:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Exercise worker crash recovery
        run: make incident-compose
      - name: Preserve incident evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-crash-incident-${{ github.sha }}
          path: artifacts/incident
          if-no-files-found: error
          retention-days: 14
          compression-level: 9

  candidate-attestation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, e2e, verify, postgres, measurement, incident]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate commit-bound candidate attestation
        run: >-
          python3 scripts/release_attestation.py
          --sha "$GITHUB_SHA"
          --run-id "$GITHUB_RUN_ID"
          --repository "$GITHUB_REPOSITORY"
          --ref "$GITHUB_REF"
          --output artifacts/release-candidate/attestation.json
      - name: Preserve candidate attestation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.sha }}
          path: artifacts/release-candidate/attestation.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  release-bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [candidate-attestation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.go-version'
          cache: false
      - name: Build and verify bounded Linux release bundle
        run: make release-bundle RELEASE_SHA="$GITHUB_SHA"
      - name: Preserve release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle-${{ github.sha }}
          path: artifacts/release-bundle/small-chain-platform-v0.1.0-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  packaged-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [release-bundle]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the verified candidate archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          timeout 60s gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "release-bundle-$GITHUB_SHA"
          --dir artifacts/release-bundle
      - name: Exercise packaged binaries without a Go toolchain
        run: make release-bundle-smoke RELEASE_SHA="$GITHUB_SHA"
      - name: Preserve packaged-runtime evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-smoke-${{ github.sha }}
          path: artifacts/release-bundle-smoke/evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  packaged-postgres-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [packaged-smoke]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 4
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: small_chain
          POSTGRES_PASSWORD: package_smoke_only
          POSTGRES_DB: small_chain_package_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U small_chain -d small_chain_package_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://small_chain:package_smoke_only@localhost:5432/small_chain_package_smoke?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download the verified candidate archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          timeout 60s gh run download "$GITHUB_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "release-bundle-$GITHUB_SHA"
          --dir artifacts/release-bundle
      - name: Exercise the packaged durable stack
        run: make release-bundle-postgres-smoke RELEASE_SHA="$GITHUB_SHA"
      - name: Preserve packaged durable-runtime evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-postgres-smoke-${{ github.sha }}
          path: artifacts/release-bundle-postgres-smoke/evidence.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  candidate-evidence-summary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [packaged-postgres-smoke]
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read candidate artifact and job identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/candidate-evidence-input
          timeout 60s gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > artifacts/candidate-evidence-input/artifacts.json
          timeout 60s gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" > artifacts/candidate-evidence-input/jobs.json
      - name: Download exact candidate evidence inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          timeout 60s gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "candidate-$GITHUB_SHA" --dir artifacts/candidate-evidence-input/candidate
          timeout 60s gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-bundle-$GITHUB_SHA" --dir artifacts/candidate-evidence-input/release
          timeout 60s gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "packaged-smoke-$GITHUB_SHA" --dir artifacts/candidate-evidence-input/memory
          timeout 60s gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "packaged-postgres-smoke-$GITHUB_SHA" --dir artifacts/candidate-evidence-input/postgres
      - name: Build strict candidate evidence index
        run: make candidate-evidence-summary RELEASE_SHA="$GITHUB_SHA" RELEASE_RUN_ID="$GITHUB_RUN_ID"
      - name: Preserve candidate evidence summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-evidence-summary-${{ github.sha }}
          path: artifacts/candidate-evidence-summary/summary.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
