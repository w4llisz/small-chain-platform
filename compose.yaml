name: small-chain

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: small_chain
      POSTGRES_USER: small_chain
      POSTGRES_PASSWORD: local_compose_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    image: small-chain-platform:local
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: postgres://small_chain:local_compose_only@postgres:5432/small_chain?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: small-chain-platform:local
    command: ["-addr=0.0.0.0:8080", "-storage=postgres", "-retention-interval=1m", "-retention-batch=100"]
    environment:
      DATABASE_URL: postgres://small_chain:local_compose_only@postgres:5432/small_chain?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck", "-url=http://127.0.0.1:8080/readyz", "-timeout=2s"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    ports:
      - "127.0.0.1:8080:8080"
    restart: "on-failure:3"
    stop_grace_period: 12s

  worker:
    image: small-chain-platform:local
    entrypoint: ["/small-chain-worker"]
    command: ["-owner=compose-worker", "-metrics-addr=0.0.0.0:9091"]
    environment:
      DATABASE_URL: postgres://small_chain:local_compose_only@postgres:5432/small_chain?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck", "-url=http://127.0.0.1:9091/metrics", "-timeout=2s"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    ports:
      - "127.0.0.1:9091:9091"
    restart: "on-failure:3"
    stop_grace_period: 35s

volumes:
  postgres-data:
