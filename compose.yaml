name: small-chain

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: small_chain
      POSTGRES_USER: small_chain
      POSTGRES_PASSWORD: local_compose_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build: .
    image: small-chain-platform:local
    entrypoint: ["/migrate"]
    environment:
      DATABASE_URL: postgres://small_chain:local_compose_only@postgres:5432/small_chain?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: small-chain-platform:local
    command: ["-addr=0.0.0.0:8080", "-storage=postgres", "-retention-interval=1m", "-retention-batch=100"]
    environment:
      DATABASE_URL: postgres://small_chain:local_compose_only@postgres:5432/small_chain?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck", "-url=http://127.0.0.1:8080/readyz", "-timeout=2s"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    ports:
      - "127.0.0.1:8080:8080"
    restart: "on-failure:3"
    stop_grace_period: 12s

  worker:
    image: small-chain-platform:local
    entrypoint: ["/small-chain-worker"]
    command: ["-owner=compose-worker", "-metrics-addr=0.0.0.0:9091"]
    environment:
      DATABASE_URL: postgres://small_chain:local_compose_only@postgres:5432/small_chain?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/healthcheck", "-url=http://127.0.0.1:9091/metrics", "-timeout=2s"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    ports:
      - "127.0.0.1:9091:9091"
    restart: "on-failure:3"
    stop_grace_period: 35s

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "healthy", "--url=http://127.0.0.1:9090"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 2s
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: "on-failure:3"
    stop_grace_period: 10s

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/small-chain-overview.json
      GF_SECURITY_ADMIN_PASSWORD: local_compose_only
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: "on-failure:3"
    stop_grace_period: 10s

volumes:
  postgres-data:
  prometheus-data:
